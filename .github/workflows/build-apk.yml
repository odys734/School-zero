name: Build SchoolZero APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm install

      - name: Install Capacitor build dependencies
        run: |
          npm install --no-save \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/cli@7 \
            @capacitor/local-notifications@7

      - name: Build SchoolZero web app
        run: npm run build

      - name: Generate Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.schoolzero.app',
            appName: 'SchoolZero',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload SchoolZero APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolZero-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
